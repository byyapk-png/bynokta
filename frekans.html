<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Frekans Pro - ByNoKTa</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #06080f; --card: #111627; --cyan: #00f0ff; --magenta: #ff00aa; --text: #e8f4f8; }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'JetBrains Mono', monospace; background: var(--bg); color: var(--text); min-height: 100vh; padding: 10px; overflow-x: hidden; }
        
        .back-link { position: absolute; top: 15px; left: 15px; color: #8b9dc3; text-decoration: none; font-weight: bold; font-size: 14px; z-index: 100; }
        
        .container { width: 100%; max-width: 1000px; margin: 45px auto 10px; background: rgba(17, 22, 39, 0.9); border-radius: 15px; border: 1px solid rgba(255,255,255,0.1); padding: 15px; }
        h1 { font-family: 'Orbitron', sans-serif; font-size: 22px; text-align: center; margin-bottom: 20px; background: linear-gradient(135deg, var(--cyan), var(--magenta)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        .main-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        @media (max-width: 768px) { .main-grid { grid-template-columns: 1fr; } }

        .panel { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; padding: 15px; }
        .control-group { margin-bottom: 15px; }
        label { display: flex; justify-content: space-between; font-size: 12px; color: var(--cyan); margin-bottom: 5px; font-weight: bold; }
        input[type="range"] { width: 100%; cursor: pointer; }
        select, input[type="number"] { width: 100%; padding: 8px; background: #000; border: 1px solid #333; border-radius: 5px; color: #fff; font-size: 14px; }

        .main-buttons { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-top: 15px; }
        .btn { padding: 10px 5px; border: none; border-radius: 8px; font-family: 'Orbitron', sans-serif; font-weight: bold; font-size: 10px; cursor: pointer; }
        .btn-play { background: var(--cyan); color: #000; }
        .btn-stop { background: #333; color: #fff; }
        .btn-rec { background: #ff4444; color: #fff; }

        .category-scroll { display: flex; gap: 5px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 10px; scrollbar-width: none; }
        .cat-btn { padding: 6px 12px; background: #1a1f2e; border: 1px solid #333; border-radius: 15px; color: #8b9dc3; white-space: nowrap; font-size: 11px; cursor: pointer; }
        .cat-btn.active { background: var(--cyan); color: #000; border-color: var(--cyan); }

        .preset-grid { display: none; grid-template-columns: repeat(auto-fill, minmax(85px, 1fr)); gap: 8px; }
        .preset-grid.active { display: grid; }
        .preset-item { padding: 8px; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; font-size: 10px; text-align: center; cursor: pointer; }
        .preset-item:hover { border-color: var(--magenta); }

        .visualizer { width: 100%; height: 50px; display: flex; align-items: flex-end; justify-content: center; gap: 2px; margin-top: 15px; background: rgba(0,0,0,0.2); border-radius: 8px; }
        .bar { flex: 1; background: var(--cyan); min-height: 2px; }
    </style>
</head>
<body>

    <a href="index.html" class="back-link">← PORTAL</a>

    <div class="container">
        <h1>FREKANS PRO</h1>

        <div class="main-grid">
            <div class="panel">
                <div class="control-group">
                    <label>Frekans: <span id="freqVal">440</span> Hz</label>
                    <input type="range" id="freqRange" min="20" max="1000" value="440">
                    <input type="number" id="freqNum" value="440" style="margin-top:8px">
                </div>
                <div class="control-group">
                    <label>Ses Seviyesi: <span id="volVal">50</span></label>
                    <input type="range" id="volRange" min="0" max="100" value="50">
                </div>
                <div class="control-group">
                    <label>Dalga Tipi</label>
                    <select id="waveType">
                        <option value="sine">Sinüs (Yumuşak)</option>
                        <option value="square">Kare (Sert)</option>
                        <option value="sawtooth">Testere (Keskin)</option>
                    </select>
                </div>
                <div class="main-buttons">
                    <button class="btn btn-play" id="startBtn">BAŞLAT</button>
                    <button class="btn btn-stop" id="stopBtn">DURDUR</button>
                    <button class="btn btn-rec" id="recBtn">REC</button>
                </div>
            </div>

            <div class="panel">
                <div class="category-scroll">
                    <button class="cat-btn active" onclick="setCat('head', this)">🧠 Kafa</button>
                    <button class="cat-btn" onclick="setCat('body', this)">❤️ Organ</button>
                    <button class="cat-btn" onclick="setCat('solf', this)">🎵 Solfeggio</button>
                    <button class="cat-btn" onclick="setCat('chak', this)">🌈 Çakra</button>
                </div>
                <div id="cat-head" class="preset-grid active">
                    <div class="preset-item" onclick="setF(40,'sine')">Baş Ağrısı</div>
                    <div class="preset-item" onclick="setF(50,'sine')">Boyun</div>
                    <div class="preset-item" onclick="setF(120,'square')">Sinüs</div>
                    <div class="preset-item" onclick="setF(741,'sine')">Tiroid</div>
                </div>
                <div id="cat-body" class="preset-grid">
                    <div class="preset-item" onclick="setF(337,'sine')">Kan Dolaşım</div>
                    <div class="preset-item" onclick="setF(639,'sine')">Kalp Ritm</div>
                    <div class="preset-item" onclick="setF(319,'sine')">Böbrek</div>
                    <div class="preset-item" onclick="setF(111,'square')">Bağırsak</div>
                </div>
                <div id="cat-solf" class="preset-grid">
                    <div class="preset-item" onclick="setF(174,'sine')">174Hz (Ağrı)</div>
                    <div class="preset-item" onclick="setF(396,'sine')">396Hz (Korku)</div>
                    <div class="preset-item" onclick="setF(528,'sine')">528Hz (DNA)</div>
                    <div class="preset-item" onclick="setF(852,'sine')">852Hz (Sezgi)</div>
                </div>
                <div id="cat-chak" class="preset-grid">
                    <div class="preset-item" onclick="setF(194,'sine')">🔴 Kök</div>
                    <div class="preset-item" onclick="setF(126,'sine')">🟡 Solar</div>
                    <div class="preset-item" onclick="setF(136,'sine')">🟢 Kalp</div>
                    <div class="preset-item" onclick="setF(141,'sine')">🟣 Taç</div>
                </div>
                <div class="visualizer" id="vis"></div>
            </div>
        </div>
    </div>

    <script>
        let ctx, osc, gain, analyzer, active=false, recorder, chunks=[];
        const bars=[]; 
        for(let i=0;i<20;i++){const b=document.createElement('div');b.className='bar';document.getElementById('vis').appendChild(b);bars.push(b);}

        function init(){
            if(!ctx){
                ctx=new(window.AudioContext||window.webkitAudioContext)();
                gain=ctx.createGain(); analyzer=ctx.createAnalyser(); analyzer.fftSize=64;
                gain.connect(analyzer); analyzer.connect(ctx.destination);
            }
        }
        function start(){
            init(); if(active) stop();
            osc=ctx.createOscillator(); osc.type=document.getElementById('waveType').value;
            osc.frequency.value=document.getElementById('freqRange').value;
            osc.connect(gain); gain.gain.value=document.getElementById('volRange').value/100;
            osc.start(); active=true; draw();
        }
        function stop(){ if(osc){osc.stop();osc.disconnect();} active=false; }
        function setF(f,w){
            document.getElementById('freqRange').value=f; document.getElementById('freqNum').value=f;
            document.getElementById('freqVal').innerText=f; document.getElementById('waveType').value=w;
            if(active) start();
        }
        function setCat(id,btn){
            document.querySelectorAll('.preset-grid').forEach(g=>g.classList.remove('active'));
            document.querySelectorAll('.cat-btn').forEach(b=>b.classList.remove('active'));
            document.getElementById('cat-'+id).classList.add('active'); btn.classList.add('active');
        }
        function draw(){
            if(!active) return; requestAnimationFrame(draw);
            const data=new Uint8Array(analyzer.frequencyBinCount); analyzer.getByteFrequencyData(data);
            bars.forEach((b,i)=> b.style.height=(data[i]||0)/3+'px');
        }
        document.getElementById('startBtn').onclick=start;
        document.getElementById('stopBtn').onclick=stop;
        document.getElementById('freqRange').oninput=(e)=>{
            document.getElementById('freqVal').innerText=e.target.value;
            document.getElementById('freqNum').value=e.target.value;
            if(active) osc.frequency.value=e.target.value;
        };
        document.getElementById('recBtn').onclick=async()=>{
            if(!active){alert("Önce BAŞLAT'a basın!");return;}
            const s=prompt("Kaç saniye?","30"); if(!s)return;
            const dest=ctx.createMediaStreamDestination(); gain.connect(dest);
            recorder=new MediaRecorder(dest.stream); chunks=[];
            recorder.ondataavailable=e=>chunks.push(e.data);
            recorder.onstop=()=>{
                const blob=new Blob(chunks,{type:'audio/webm'}); const url=URL.createObjectURL(blob);
                const a=document.createElement('a'); a.href=url; a.download=`ByNoKTa_Freq_${document.getElementById('freqRange').value}Hz.webm`; a.click();
            };
            recorder.start(); setTimeout(()=>recorder.stop(),s*1000);
        };
        // Güvenlik
        window.addEventListener('contextmenu',e=>e.preventDefault());
        window.addEventListener('keydown',e=>{if(e.keyCode===123||(e.ctrlKey&&e.shiftKey&&(e.keyCode===73||e.keyCode===74))||(e.ctrlKey&&e.keyCode===85))e.preventDefault();});
    </script>
</body>
</html>

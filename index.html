<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ByNokta</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .card {
      background: rgba(0,0,0,0.45);
      padding: 40px;
      border-radius: 16px;
      text-align: center;
      max-width: 420px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.4);
    }
    h1 {
      margin-bottom: 10px;
      font-size: 32px;
      letter-spacing: 1px;
    }
    p {
      opacity: 0.85;
      margin-bottom: 30px;
    }
    a {
      display: inline-block;
      padding: 14px 28px;
      background: #00c6ff;
      color: #000;
      text-decoration: none;
      border-radius: 30px;
      font-weight: bold;
      transition: transform .2s, box-shadow .2s;
    }
    a:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(0,198,255,0.6);
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>ByNokta</h1>
    <p>Yakında buradayız.</p>
    <a href="#">İletişim</a>
  </div>
</body>
</html>

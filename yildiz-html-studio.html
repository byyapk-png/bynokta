<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Yıldız HTML Studio</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b101a;color:#e5edf8;font:14px system-ui,sans-serif}header{padding:18px 22px;border-bottom:1px solid #293347;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}h1{font-size:19px;margin:0;letter-spacing:.5px}h1 span{color:#60d6ca}header p{margin:5px 0 0;color:#98a9bf;font-size:12px}.actions,.tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap}button,.file{border:1px solid #34435b;background:#192338;color:#e5edf8;padding:9px 12px;border-radius:8px;cursor:pointer;font:inherit}button:hover,.file:hover{background:#263651}button:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid #60d6ca;outline-offset:2px}.primary{background:#60d6ca;color:#09201d;border-color:#60d6ca;font-weight:700}.file input{display:none}main{height:calc(100dvh - 98px);min-height:500px;display:grid;grid-template-columns:minmax(280px,43%) 1fr}.pane{min-width:0;display:flex;flex-direction:column}.editor{border-right:1px solid #293347}.bar{min-height:55px;padding:10px 14px;border-bottom:1px solid #293347;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}.bar strong{font-size:12px;letter-spacing:1px;color:#a9bbd1}textarea{resize:none;flex:1;width:100%;border:0;background:#101725;color:#d9e9f9;padding:18px;font:13px/1.7 ui-monospace,Consolas,monospace;tab-size:2;outline:none}label{font-size:12px}.status{min-height:33px;padding:8px 14px;font-size:11px;color:#9eafc5;border-top:1px solid #293347}.stage{flex:1;min-height:300px;background:#222c3d;padding:16px;overflow:auto;display:flex;justify-content:center;align-items:flex-start}iframe{border:0;background:white;width:100%;height:100%;min-height:400px;flex-shrink:0;box-shadow:0 8px 35px #0004}.preview:fullscreen{background:#0b101a;height:100dvh}.hint{padding:8px 14px;color:#9eafc5;font-size:11px;border-top:1px solid #293347}select{background:#192338;color:#e5edf8;border:1px solid #34435b;border-radius:6px;padding:7px}button[aria-pressed=true]{border-color:#60d6ca;color:#60d6ca}@media(max-width:800px){header{padding:14px}main{height:auto;grid-template-columns:1fr}.editor{height:440px;border-right:0;border-bottom:1px solid #293347}.preview{height:650px}.actions button,.actions .file{font-size:12px;padding:8px}.stage{padding:10px}} 
</style></head><body>
<header><div><h1>YILDIZ <span>HTML STUDIO</span></h1><p>Kodunu yapıştır. Sonucu anında gör.</p></div><div class="actions"><button id="paste">Yapıştır</button><button id="open">Dosya aç</button><input id="file" type="file" accept=".html,.htm,text/html" hidden><button id="download" class="primary">HTML indir</button></div></header>
<main><section class="pane editor" aria-label="Kod düzenleyici"><div class="bar"><strong>HTML / CSS / JAVASCRIPT</strong><div class="tools"><label><input id="live" type="checkbox" checked> Canlı önizleme</label><button id="run">▶ Çalıştır</button><button id="clear">Temizle</button></div></div><textarea id="code" aria-label="HTML kodu" spellcheck="false" autocapitalize="off" autocomplete="off" placeholder="HTML kodunu buraya yapıştır…"></textarea><div class="status" id="status" role="status" aria-live="polite">Hazır</div></section>
<section class="pane preview" id="preview" aria-label="Canlı önizleme"><div class="bar"><strong>ÖNİZLEME</strong><div class="tools"><select id="size" aria-label="Önizleme genişliği"><option value="100%">Bilgisayar • Esnek</option><option value="768px">Tablet • 768 px</option><option value="390px">Telefon • 390 px</option><option value="320px">Küçük telefon • 320 px</option></select><button id="full">⛶ Tam ekran</button></div></div><div class="stage"><iframe id="frame" title="HTML önizlemesi" sandbox="allow-scripts allow-forms allow-modals allow-popups allow-downloads"></iframe></div><div class="hint">Kod cihazında saklanır. Önizleme dış kaynakları internetten yükleyebilir. Korumalı önizlemede bazı depolama ve yönlendirme işlemleri sınırlıdır.</div></section></main>
<script>
'use strict';
const $=id=>document.getElementById(id),code=$('code'),frame=$('frame'),status=$('status'),KEY='yildiz-html-studio-v1';let timer;
const demo='<!doctype html>\n<html lang="tr">\n<head>\n<meta charset="utf-8">\n<meta name="viewport" content="width=device-width,initial-scale=1">\n<title>İlk sayfam</title>\n<style>\nbody{margin:0;min-height:100vh;display:grid;place-items:center;background:#eef4f7;font-family:system-ui;color:#122537}\nmain{max-width:520px;padding:40px}\nsmall{color:#087f72;font-weight:700;letter-spacing:3px}\nh1{font-size:clamp(32px,8vw,58px);line-height:1.05}\np{line-height:1.7;color:#526777}\nbutton{background:#087f72;color:white;border:0;border-radius:12px;padding:14px 22px;font:inherit;cursor:pointer}\n</style>\n</head>\n<body><main><small>YILDIZ HTML STUDIO</small><h1>Fikrin burada<br>hayat bulsun.</h1><p>Soldaki kodu değiştir veya kendi HTML kodunu yapıştır. Tasarımın burada anında görünsün.</p><button onclick="this.textContent=\'Çalışıyor! ✓\'">Beni dene</button></main></body>\n</html>';
function render(){frame.srcdoc=code.value}
function save(){try{localStorage.setItem(KEY,code.value);status.textContent='Cihazda kaydedildi • '+code.value.length.toLocaleString('tr-TR')+' karakter'}catch(e){status.textContent='Otomatik kayıt kullanılamıyor. HTML indir ile yedekle.'}}
function changed(){save();clearTimeout(timer);if($('live').checked)timer=setTimeout(render,400)}
try{const saved=localStorage.getItem(KEY);code.value=saved===null?demo:saved;status.textContent=saved===null?'Örnek hazır • Kendi kodunu yapıştırabilirsin':'Son kodun geri yüklendi'}catch(e){code.value=demo;status.textContent='Otomatik kayıt kullanılamıyor. HTML indir ile yedekle.'}render();
code.addEventListener('input',changed);code.addEventListener('keydown',e=>{if(e.key==='Tab'){e.preventDefault();const a=code.selectionStart,b=code.selectionEnd;code.setRangeText('  ',a,b,'end');changed()}if((e.ctrlKey||e.metaKey)&&e.key==='Enter'){e.preventDefault();render()}});
$('run').onclick=()=>{clearTimeout(timer);render();save()};$('live').onchange=()=>{clearTimeout(timer);if($('live').checked)render()};
$('clear').onclick=()=>{if(code.value&&!confirm('Düzenleyicideki kod temizlensin mi?'))return;code.value='';save();clearTimeout(timer);render();code.focus()};
$('paste').onclick=async()=>{try{const text=await navigator.clipboard.readText();if(code.value&&!confirm('Mevcut kod panodaki içerikle değiştirilsin mi?'))return;code.value=text;changed();render()}catch(e){code.focus();status.textContent='Kod alanına tıklayıp Ctrl+V ile yapıştırabilirsin.'}};
$('open').onclick=()=>$('file').click();$('file').onchange=async e=>{const f=e.target.files[0];if(!f)return;if(code.value&&!confirm('Mevcut kod seçilen dosyayla değiştirilsin mi?')){e.target.value='';return}try{code.value=await f.text();changed();render()}catch(err){status.textContent='Dosya okunamadı.'}e.target.value=''};
$('download').onclick=()=>{const blob=new Blob([code.value],{type:'text/html;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='yildiz-sayfam.html';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)};
$('size').onchange=e=>frame.style.width=e.target.value;
$('full').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await $('preview').requestFullscreen()}catch(e){status.textContent='Bu tarayıcı tam ekranı desteklemiyor.'}};
document.addEventListener('fullscreenchange',()=>$('full').textContent=document.fullscreenElement?'⛶ Tam ekrandan çık':'⛶ Tam ekran');
window.addEventListener('pagehide',()=>{try{localStorage.setItem(KEY,code.value)}catch(e){}});
</script></body></html>
